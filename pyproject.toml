# Mixed file. Owned by the project: [project] and its sub-tables, and every table after the
# "project" marker at the end. Owned by the project template (cs-project-template, change it there): [build-system]
# and the tables between the "template" markers. Never edit a template line here: `copier update` keeps the project
# lines and replaces the template ones.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csopencvcuda"
version = "5.1.0"
description = "OpenCV 5 with CUDA built for Linux x64 and Windows"
authors = [
  { name = "cscosine-dev", email = "cscosine@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    # template: the tools of .pre-commit-config.yaml and the tests
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=1.20",
    "ruff>=0.15",
    "pre-commit>=4",
    "import-linter[ui]>=2.11",
    "types-PyYAML",
    "copier>=9.4",
    # project: below
]

# === template: begin =================================================================================================

[tool.setuptools.packages.find]
where = ["./"]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E, W: pycodestyle; F: pyflakes; I: import sorting; B: bugbear; UP: pyupgrade; SIM: simplifications;
# N: PEP 8 naming; C4: comprehensions
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "./"
# the csorchestrator workspace
exclude = "^_csw/"
python_version = "3.11"
# strict: no implicit Any, strict optional, unused ignores reported
strict = true
# third-party libraries without type hints
ignore_missing_imports = true
# ./ is the package root: no guessing
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# markers and the --run-* options: conftest.py
testpaths = ["tests"]
norecursedirs = ["_csw", "*.egg-info", ".git", "__pycache__"]
pythonpath = ["./"]
addopts = ["-ra", "--strict-markers"]

# === template: end ===================================================================================================

# --- project ---
